name: Bug report
description: Report reproducible Stanlee behavior
body:
  - type: textarea
    attributes:
      label: Environment and source revisions
      description: OS, client version, Stanlee version, bridge/fork revision and Qt version. Remove tokens and private paths.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior and sanitized diagnostics
    validations:
      required: true
