name: Native baseline and bridge
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, qt: '5.15.2', arch: gcc_64, modules: ''}
          - {os: ubuntu-latest, qt: '6.5.3', arch: gcc_64, modules: 'qtmultimedia'}
          - {os: macos-15-intel, qt: '5.15.2', arch: clang_64, modules: ''}
          - {os: macos-14, qt: '6.5.3', arch: clang_64, modules: 'qtmultimedia'}
          - {os: windows-2022, qt: '5.15.2', arch: win64_msvc2019_64, modules: ''}
          - {os: windows-2022, qt: '6.5.3', arch: win64_msvc2019_64, modules: 'qtmultimedia'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read immutable native revisions
        id: revisions
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          manifest = json.load(open('build-manifest.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('base=' + manifest['upstream_revision'] + '\n')
              output.write('fork=' + manifest['fork_revision'] + '\n')
          PY
      - uses: actions/checkout@v7
        with:
          repository: splitintech/pencil
          ref: ${{ steps.revisions.outputs.base }}
          path: native-baseline
      - uses: actions/checkout@v7
        with:
          repository: splitintech/pencil
          ref: ${{ steps.revisions.outputs.fork }}
          path: native-bridge
          fetch-depth: 0
      - name: Verify bundled fixes and native ancestry
        run: python scripts/verify_native_fixes.py --native native-bridge
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 ffmpeg
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          modules: ${{ matrix.modules }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows media validator
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: macOS media validator
        if: runner.os == 'macOS' && matrix.qt == '6.5.3'
        run: brew install ffmpeg
      - name: Unchanged upstream build and tests, then bridge build and tests
        if: runner.os != 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_STYLE_OVERRIDE: Fusion
        run: |
          for tree in native-baseline native-bridge; do
            mkdir "$tree/build"
            if [ "$tree" = native-bridge ]; then bridge=1; else bridge=0; fi
            (cd "$tree" && qmake -o build CONFIG-=debug_and_release CONFIG+=release STANLEE_AUTOMATION="$bridge")
            if [ "$RUNNER_OS" = Windows ]; then
              (cd "$tree/build" && nmake)
              testbin=$(find "$tree/build/tests" -name tests.exe -type f | head -1)
            else
              make -C "$tree/build" -j4
              testbin="$tree/build/tests/tests"
            fi
            test -n "$testbin"
            "$testbin"
          done
      - name: Windows unchanged upstream and bridge builds and tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_STYLE_OVERRIDE: Fusion
        run: |
          foreach ($tree in @('native-baseline', 'native-bridge')) {
            New-Item -ItemType Directory -Path "$tree/build" | Out-Null
            $bridge = if ($tree -eq 'native-bridge') { '1' } else { '0' }
            Push-Location $tree
            & qmake -o build 'CONFIG-=debug_and_release' 'CONFIG+=release' "STANLEE_AUTOMATION=$bridge"
            if ($LASTEXITCODE -ne 0) { throw 'qmake failed' }
            Push-Location build
            & nmake
            if ($LASTEXITCODE -ne 0) { throw 'native build failed' }
            $testbin = Get-ChildItem tests -Recurse -Filter tests.exe | Select-Object -First 1
            if (-not $testbin) { throw 'native tests executable missing' }
            & $testbin.FullName
            if ($LASTEXITCODE -ne 0) { throw 'native tests failed' }
            Pop-Location
            Pop-Location
          }
      - name: Check upstream capability drift and shared registry
        shell: bash
        run: |
          python scripts/inventory.py native-baseline --check
          python - <<'PY'
          import json
          expected = json.load(open('contracts/operations.json'))
          assert expected == json.load(open('src/stanlee/operations.json'))
          assert expected == json.load(open('native-bridge/app/data/automation-operations.json'))
          PY
      - uses: actions/setup-python@v6
        if: matrix.qt == '6.5.3'
        with:
          python-version: '3.12'
      - name: Native MCP integration
        if: matrix.qt == '6.5.3'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_STYLE_OVERRIDE: Fusion
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          if [ "$RUNNER_OS" = macOS ]; then
            export STANLEE_TEST_APP="$GITHUB_WORKSPACE/native-bridge/build/app/Pencil2D-Stanlee.app/Contents/MacOS/pencil2d-stanlee"
          elif [ "$RUNNER_OS" = Windows ]; then
            export STANLEE_TEST_APP=$(find "$GITHUB_WORKSPACE/native-bridge/build/app" -name pencil2d-stanlee.exe -type f | head -1)
          else
            export STANLEE_TEST_APP="$GITHUB_WORKSPACE/native-bridge/build/app/pencil2d-stanlee"
          fi
          python scripts/deploy_test_encoder.py --application "$STANLEE_TEST_APP"
          python -m pytest
